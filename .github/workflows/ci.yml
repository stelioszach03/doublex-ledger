name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12' ]
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        options: >-
          --health-cmd="pg_isready -U ledger"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic migrate
        env:
          APP_ENV: dev
          POSTGRES_DSN: postgresql+psycopg://ledger:ledger@localhost:5432/ledger
          PYTHONPATH: ${{ github.workspace }}
        run: |
          alembic upgrade head
      - name: Run tests with coverage
        env:
          APP_ENV: dev
          POSTGRES_DSN: postgresql+psycopg://ledger:ledger@localhost:5432/ledger
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest --cov=ledger --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov
      - name: Build Docker images
        run: |
          docker build -f docker/Dockerfile.api -t ledger-api-ci .
          docker build -f docker/Dockerfile.recon -t ledger-recon-ci .
